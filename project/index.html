<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/app-icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/app-icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/app-icon-120.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LC Store</title>
    <meta property="og:image" content="https://lamelo16flow.github.io/Life-change-APP/og-image.png" />
    <meta property="og:title" content="LC Store" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lamelo16flow.github.io/Life-change-APP/og-image.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LC Store" />
    <meta name="application-name" content="LC Store" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preload" as="image" href="/logo-wordmark.webp" type="image/webp" />
    <style>
      /* Shown instantly while the app loads (also reused by the app itself). */
      html, body { margin: 0; background: #ffffff; }
      .lc-splash {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f3faf3 60%, #e6f4e6 100%);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        animation: lc-fade-in .25s ease-out both;
      }
      .lc-splash__logo { width: min(320px, 72vw); height: auto; filter: drop-shadow(0 10px 22px rgba(22,163,74,.18)); animation: lc-float 2.4s ease-in-out infinite; }
      .lc-splash__bar { width: 140px; height: 4px; border-radius: 999px; background: rgba(22,101,52,.12); overflow: hidden; }
      .lc-splash__bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #84cc16, #16a34a); animation: lc-slide 1.1s ease-in-out infinite; }
      .lc-splash__tag { color: #4b5563; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
      @keyframes lc-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes lc-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes lc-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .lc-splash, .lc-splash__logo, .lc-splash__bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="lc-splash" role="status" aria-label="LC Store">
        <img class="lc-splash__logo" src="/logo-wordmark.webp" alt="LC Store" />
        <div class="lc-splash__bar"></div>
        <div class="lc-splash__tag">Buy • Shop • Enjoy</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
