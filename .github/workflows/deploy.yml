name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'project/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Required by actions/deploy-pages (the previous runs failed with
    # "Missing environment").
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./project
        run: npm ci

      - name: Build
        working-directory: ./project
        # Public values (they ship inside the website anyway). Repository
        # secrets of the same name override them if set. Without them the
        # build has no Supabase address and the site shows a white screen.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://eqqfbdyjcvwmrnbtvarb.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcWZiZHlqY3Z3bXJuYnR2YXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY3NzgwMjMsImV4cCI6MjA4MjM1NDAyM30.KujqmUru0ja7l0Lx-n8elZUqEGJSwPY1U1Twss_1bxQ' }}
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Supabase env missing"; exit 1; }
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './project/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
